<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asisten Cerdas Perpustakaan UNIJA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root { --bg: #f0f4f8; --paper: #ffffff; --ink: #1f2937; --accent: #10b981; --accent-hover: #059669; --bubble-user: #d1fae5; --bubble-bot: #f3f4f6; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  
  /* Layar Auth */
  #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; text-align: center; }
  .auth-card { background: var(--paper); padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
  .auth-card h1 { font-size: 1.5rem; margin-bottom: 10px; color: var(--accent-hover); }
  .auth-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
  .auth-card button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
  
  /* Layar Chat Utama */
  #chat-screen { display: none; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; width: 100%; background: var(--paper); box-shadow: 0 0 20px rgba(0,0,0,0.05); }
  #chat-header { padding: 16px 24px; background: var(--paper); border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  #chat-header h2 { font-size: 1.2rem; margin: 0; }
  #btn-rating { background: #f59e0b; color: white; border: none; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
  
  #chat-log { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 1rem; word-wrap: break-word; }
  .user { background: var(--bubble-user); align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot { background: var(--bubble-bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .img-preview { max-width: 200px; border-radius: 8px; margin-bottom: 8px; display: block; }
  
  /* Area Input */
  #input-area { padding: 16px 24px; border-top: 1px solid #e5e7eb; background: var(--paper); display: flex; gap: 12px; align-items: center; }
  #file-label { cursor: pointer; font-size: 1.5rem; padding: 8px; border-radius: 50%; transition: background 0.2s; }
  #file-label:hover { background: #f3f4f6; }
  #image-upload { display: none; }
  #user-input { flex: 1; padding: 14px 20px; border: 1px solid #d1d5db; border-radius: 999px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
  #user-input:focus { border-color: var(--accent); }
  #send-btn { background: var(--accent); color: white; border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
  #send-btn:disabled { background: #9ca3af; cursor: not-allowed; }

  /* Rating Modal */
  #rating-modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
  .rating-box { background: white; padding: 30px; border-radius: 16px; text-align: center; }
  .stars button { font-size: 2rem; background: none; border: none; cursor: pointer; margin: 0 5px; }
</style>
<!-- Menggunakan Import Map untuk memanggil Gemini SDK -->
<script type="importmap">
  {
    "imports": {
      "@google/generative-ai": "https://esm.run/@google/generative-ai"
    }
  }
</script>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <h1>Asisten Perpustakaan</h1>
    <p style="margin-bottom: 20px; color: #6b7280;" id="status-text">Memuat sistem pedoman FAQ...</p>
    <input type="text" id="input-nama" placeholder="Nama Lengkap" required>
    <input type="text" id="input-prodi" placeholder="Program Studi" required>
    <button id="btn-mulai" disabled>Mulai Obrolan</button>
  </div>
</div>

<div id="chat-screen">
  <div id="chat-header">
    <h2>💬 Asisten Perpustakaan UNIJA</h2>
    <button id="btn-rating">Akhiri & Beri Rating</button>
  </div>
  <div id="chat-log"></div>
  <div id="input-area">
    <label id="file-label" for="image-upload" title="Unggah Gambar">🖼️</label>
    <input type="file" id="image-upload" accept="image/*">
    <input type="text" id="user-input" placeholder="Tanyakan seputar perpustakaan atau jelaskan gambar yang diunggah..." autocomplete="off">
    <button id="send-btn">➤</button>
  </div>
</div>

<div id="rating-modal">
  <div class="rating-box">
    <h3>Seberapa puas Anda?</h3>
    <p style="margin: 10px 0; color: #6b7280;">Bantu kami memenuhi standar akreditasi.</p>
    <div class="stars" id="star-container"></div>
  </div>
</div>

<script type="module">
  import { GoogleGenerativeAI } from "@google/generative-ai";

  // =========================================================================
  // 1. MASUKKAN API KEY GEMINI DAN URL APPS SCRIPT DI SINI
  // =========================================================================
  const GEMINI_API_KEY = "AIzaSyAr1H-FsQ8xPaEzeobxeWLpqNm-emrvBmE"; 
  const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbx-6Yvw_exsElKxdmZE_VtNrmxZ6Cdm2g967ShEL_ZLhjviQ-pjOVCoxSBf2HDGzNnv/exec";
  // =========================================================================

  const genAI = new GoogleGenerativeAI(GEMINI_API_KEY);
  // Menggunakan model flash yang cepat dan mendukung teks+gambar
  const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

  let dataUser = { nama: "", prodi: "" };
  let systemInstruction = "Kamu adalah asisten resmi UPT Perpustakaan Universitas Wiraraja (UNIJA). Jawablah dengan ramah, gunakan bahasa Indonesia yang baik. Jawab hanya berdasarkan panduan FAQ berikut ini:\n\n";
  let chatHistory = [];

  // Elemen DOM
  const authScreen = document.getElementById('auth-screen');
  const chatScreen = document.getElementById('chat-screen');
  const btnMulai = document.getElementById('btn-mulai');
  const statusText = document.getElementById('status-text');
  const chatLog = document.getElementById('chat-log');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const imageUpload = document.getElementById('image-upload');
  
  // Baca CSV dan gabungkan menjadi instruksi untuk Gemini
  Papa.parse("perpustakaan_faq.csv", {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results) {
      results.data.forEach(row => {
        if(row.user_query && row.chatbot_response) {
          systemInstruction += `Tanya: ${row.user_query}\nJawab: ${row.chatbot_response}\n\n`;
        }
      });
      statusText.innerText = "Sistem siap digunakan!";
      btnMulai.disabled = false;
    }
  });

  btnMulai.onclick = () => {
    const nama = document.getElementById('input-nama').value.trim();
    const prodi = document.getElementById('input-prodi').value.trim();
    if(!nama || !prodi) return alert("Harap isi Nama dan Prodi!");
    
    dataUser = { nama, prodi };
    authScreen.style.display = "none";
    chatScreen.style.display = "flex";
    
    addMsg("bot", `Halo ${nama} dari prodi ${prodi}! Selamat datang di layanan informasi UPT Perpustakaan UNIJA. Ada yang bisa saya bantu terkait perpustakaan, atau ada gambar kendala yang ingin kamu tunjukkan?`);
  };

  // Fungsi mengubah gambar menjadi format yang bisa dibaca AI
  async function fileToGenerativePart(file) {
    const base64EncodedDataPromise = new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result.split(',')[1]);
      reader.readAsDataURL(file);
    });
    return {
      inlineData: { data: await base64EncodedDataPromise, mimeType: file.type },
    };
  }

  function addMsg(who, text, imgFile = null) {
    const div = document.createElement('div');
    div.className = `msg ${who}`;
    
    if(imgFile) {
      const img = document.createElement('img');
      img.className = 'img-preview';
      img.src = URL.createObjectURL(imgFile);
      div.appendChild(img);
    }
    
    const p = document.createElement('div');
    p.innerHTML = text.replace(/\n/g, "<br>");
    div.appendChild(p);
    
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  async function handleSend() {
    const text = userInput.value.trim();
    const file = imageUpload.files[0];
    
    if(!text && !file) return;

    // Tampilkan pesan user
    addMsg("user", text, file);
    userInput.value = "";
    imageUpload.value = "";
    sendBtn.disabled = true;

    // Siapkan data untuk Gemini
    let promptParts = [];
    promptParts.push(systemInstruction); // Suntikkan aturan FAQ di setiap awal pesan
    
    if(file) {
      const imagePart = await fileToGenerativePart(file);
      promptParts.push(imagePart);
    }
    promptParts.push("Pengguna bertanya: " + text);

    addMsg("bot", "<i>Sedang mengetik...</i>");
    const typingIndicator = chatLog.lastElementChild;

    try {
      const result = await model.generateContent(promptParts);
      const response = await result.response;
      typingIndicator.querySelector('div').innerHTML = response.text().replace(/\n/g, "<br>");
    } catch (error) {
      typingIndicator.querySelector('div').innerHTML = "Maaf, terjadi kesalahan saat menghubungi server AI. Pastikan API Key valid.";
      console.error(error);
    }
    sendBtn.disabled = false;
  }

  sendBtn.onclick = handleSend;
  userInput.onkeypress = (e) => { if(e.key === "Enter") handleSend(); };

  // Logika Rating & Apps Script (Tetap berfungsi seperti sebelumnya)
  document.getElementById('btn-rating').onclick = () => {
    document.getElementById('rating-modal').style.display = "flex";
    const starsDiv = document.getElementById('star-container');
    starsDiv.innerHTML = "";
    ["⭐","⭐⭐","⭐⭐⭐","⭐⭐⭐⭐","⭐⭐⭐⭐⭐"].forEach((star, index) => {
      const b = document.createElement('button');
      b.textContent = star;
      b.onclick = () => kirimDataKeGoogle(index + 1, star);
      starsDiv.appendChild(b);
    });
  };

  function kirimDataKeGoogle(rating, starStr) {
    document.getElementById('rating-modal').style.display = "none";
    addMsg("user", `Memberikan rating: ${starStr}`);
    addMsg("bot", "Menyimpan data kunjungan...");
    
    fetch(GOOGLE_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ nama: dataUser.nama, prodi: dataUser.prodi, rating: rating })
    }).then(() => {
      addMsg("bot", "Terima kasih! Penilaianmu sudah tersimpan.");
    }).catch(() => {
      addMsg("bot", "Terima kasih atas penilaiannya!");
    });
  }
</script>
</body>
</html>
