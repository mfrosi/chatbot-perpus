<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot Perpustakaan</title>
<style>
  :root { --ink:#1f2a37; --paper:#ffffff; --bg:#f3f5f7; --accent:#2f6f5e; --accent-ink:#ffffff; --bubble:#e8eef0; --star:#e0a100; --star-off:#b9c2c8; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6edf3; --paper:#1b232c; --bg:#11171d; --accent:#4fa58d; --accent-ink:#0b1410; --bubble:#27323d; --star:#f2b81c; --star-off:#4a5662; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:640px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:1.6rem; margin:0 0 8px; }

  #chat-toggle { position:fixed; right:20px; bottom:20px; width:56px; height:56px; border-radius:50%;
    border:0; background:var(--accent); color:var(--accent-ink); font-size:24px; cursor:pointer; }
  #chat-box { position:fixed; right:20px; bottom:90px; width:min(360px, calc(100vw - 40px)); height:min(520px, 75vh);
    display:none; flex-direction:column; background:var(--paper); border:1px solid var(--bubble);
    border-radius:14px; overflow:hidden; }
  #chat-box.open { display:flex; }
  #chat-head { padding:12px 16px; background:var(--accent); color:var(--accent-ink); display:flex; justify-content:space-between; align-items:center; }
  #chat-head strong { font-weight:600; }
  #end-chat { background:none; border:1px solid var(--accent-ink); color:var(--accent-ink); border-radius:999px; padding:3px 10px; font:inherit; font-size:.8rem; cursor:pointer; }
  #chat-log { padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; flex:1; }
  .msg { padding:9px 12px; border-radius:12px; max-width:88%; line-height:1.4; white-space:pre-line; }
  .bot { background:var(--bubble); align-self:flex-start; }
  .user { background:var(--accent); color:var(--accent-ink); align-self:flex-end; }
  .related { font-size:.85rem; opacity:.75; margin-top:6px; }
  .rating { background:var(--bubble); align-self:flex-start; padding:12px; border-radius:12px; }
  #start-form { padding:18px 16px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; flex:1; }
  #start-form p { margin:0 0 4px; line-height:1.4; }
  #start-form label { font-size:.85rem; opacity:.8; }
  #start-form input { padding:8px 10px; border-radius:8px; border:1px solid var(--star-off); background:var(--paper); color:var(--ink); font:inherit; width:100%; }
  #start-form .err { color:#c0392b; font-size:.85rem; }
  #start-form .submit { align-self:flex-start; margin-top:4px; border:0; background:var(--accent); color:var(--accent-ink); padding:8px 16px; border-radius:999px; cursor:pointer; font:inherit; }
  [hidden] { display:none !important; }
  .rating { display:flex; flex-direction:column; gap:8px; width:88%; }
  .rating .fld { padding:8px 10px; border-radius:8px; border:1px solid var(--star-off); background:var(--paper); color:var(--ink); font:inherit; width:100%; }
  .rating .lbl { font-size:.85rem; opacity:.8; }
  .rating .err { color:#c0392b; font-size:.85rem; min-height:0; }
  .rating .submit { align-self:flex-start; border:0; background:var(--accent); color:var(--accent-ink); padding:8px 16px; border-radius:999px; cursor:pointer; font:inherit; }
  .rating .submit:disabled { opacity:.5; cursor:default; }
  .stars { display:flex; gap:2px; }
  .stars button { background:none; border:0; font-size:30px; line-height:1; cursor:pointer; color:var(--star-off); padding:0 2px; }
  .stars button.on { color:var(--star); }
  #chat-form { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--bubble); }
  #chat-input { flex:1; padding:8px 12px; border-radius:999px; border:1px solid var(--bubble);
    background:var(--bg); color:var(--ink); font:inherit; min-width:0; }
  #chat-send { border:0; background:var(--accent); color:var(--accent-ink); padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>

<main>
  <h1>Halaman Uji Coba Chatbot Perpustakaan</h1>
  <p>Klik tombol bulat di pojok kanan bawah, lalu ketik pertanyaanmu.</p>
</main>

<button id="chat-toggle" aria-label="Buka chatbot">💬</button>
<section id="chat-box" aria-live="polite">
  <div id="chat-head"><strong>Asisten Perpustakaan</strong><button id="end-chat" type="button" hidden>Akhiri chat</button></div>
  <form id="start-form">
    <p>Sebelum mulai, isi data singkat ini ya. Data dipakai untuk evaluasi layanan perpustakaan.</p>
    <label for="f-nama">Nama</label>
    <input id="f-nama" name="nama" type="text" autocomplete="name" maxlength="80" required>
    <label for="f-prodi">Program studi</label>
    <input id="f-prodi" name="prodi" type="text" maxlength="80" required>
    <div class="err" id="start-err" role="alert"></div>
    <button class="submit" type="submit">Mulai chat</button>
  </form>
  <div id="chat-log" hidden></div>
  <form id="chat-form" hidden>
    <input id="chat-input" type="text" placeholder="Ketik pertanyaanmu di sini..." autocomplete="off" aria-label="Pertanyaan">
    <button id="chat-send" type="submit">Kirim</button>
  </form>
</section>

<script>
  // ====== DATA FAQ (berasal dari perpustakaan_faq.csv) ======
  // k = kategori, q = pertanyaan, a = jawaban
  const FAQ = [
 {
  "k": "Keanggotaan",
  "q": "Apa syarat utama jika saya mau buat kartu anggota perpustakaan?",
  "a": "Syarat utamanya adalah mengisi formulir pendaftaran, dan membawa kartu identitas yang masih berlaku (KTP/Kartu Pelajar/KTM) sebagai bukti domisili atau status Anda."
 },
 {
  "k": "Keanggotaan",
  "q": "Apakah pendaftaran anggota perpustakaan ini ada biayanya?",
  "a": "Pendaftaran anggota untuk perpustakaan umum biasanya gratis. Namun, untuk jenis perpustakaan tertentu (akademik/khusus), mungkin ada biaya bagi non-anggota institusi."
 },
 {
  "k": "Kunjungan",
  "q": "Jam berapa perpustakaan ini mulai buka hari ini?",
  "a": "Jam operasional kami bervariasi. Mohon cek situs web resmi kami atau bagian informasi kontak untuk mengetahui jam buka dan tutup yang spesifik untuk hari ini."
 },
 {
  "k": "Peminjaman",
  "q": "Maksimal saya bisa pinjam berapa eksemplar buku?",
  "a": "Kebijakan hak pinjam bervariasi tergantung jenis keanggotaan Anda. Anggota umum biasanya dapat meminjam 3-5 eksemplar, sementara dosen/staf bisa meminjam lebih banyak."
 },
 {
  "k": "Peminjaman",
  "q": "Berapa lama batas waktu peminjaman buku?",
  "a": "Batas waktu peminjaman standar adalah 7 hari (satu minggu) atau 14 hari (dua minggu) per eksemplar. Harap perhatikan tanggal jatuh tempo pada slip pinjam Anda."
 },
 {
  "k": "Peminjaman",
  "q": "Bagaimana cara saya memperpanjang masa pinjam buku online?",
  "a": "Anda dapat melakukan perpanjangan mandiri melalui Katalog Online (OPAC) di situs web kami, selama buku tersebut belum dipesan oleh pemustaka lain. Perpanjangan umumnya hanya bisa dilakukan satu kali."
 },
 {
  "k": "Peminjaman",
  "q": "Kalau saya telat mengembalikan, dendanya berapa ya?",
  "a": "Untuk keterlambatan, Anda akan dikenakan denda sebesar antara Rp 500,- hingga Rp 1.000,- per hari per eksemplar. Denda dihitung sejak tanggal jatuh tempo."
 },
 {
  "k": "Peminjaman",
  "q": "Apa yang harus saya lakukan kalau buku pinjaman saya hilang?",
  "a": "Anda wajib segera melaporkan kehilangan tersebut ke bagian sirkulasi dan menggantinya dengan buku baru (judul, pengarang, dan edisi yang sama atau edisi terbaru) sesuai ketentuan yang berlaku."
 },
 {
  "k": "Layanan/Koleksi",
  "q": "Saya bisa cari koleksi digital atau e-book di mana?",
  "a": "Koleksi digital dan e-book kami dapat diakses melalui portal E-Resources di situs web perpustakaan. Akses mungkin memerlukan login akun anggota Anda."
 },
 {
  "k": "Layanan/Fasilitas",
  "q": "Apakah di perpustakaan ada Wi-Fi gratis untuk pengunjung?",
  "a": "Ya, kami menyediakan layanan Wi-Fi gratis. Anda dapat terhubung menggunakan kredensial yang tersedia di area informasi atau meja layanan."
 },
 {
  "k": "Keanggotaan",
  "q": "Apakah pendaftaran anggota memerlukan biaya administrasi?",
  "a": "Pendaftaran anggota untuk perpustakaan umum biasanya gratis."
 },
 {
  "k": "Keanggotaan",
  "q": "Dokumen apa yang harus saya siapkan untuk mendaftar anggota?",
  "a": "Syarat utamanya adalah mengisi formulir pendaftaran, dan membawa kartu identitas yang masih berlaku (KTP/Kartu Pelajar/KTM)."
 },
 {
  "k": "Keanggotaan",
  "q": "Saya mahasiswa, bagaimana cara buat kartu perpustakaan?",
  "a": "Syarat utamanya adalah mengisi formulir pendaftaran dan membawa kartu identitas (KTM)."
 },
 {
  "k": "Keanggotaan",
  "q": "Bagaimana cara perpanjang masa berlaku kartu anggota?",
  "a": "Prosedur perpanjangan kartu dapat dilihat di situs web resmi atau tanyakan di meja informasi."
 },
 {
  "k": "Kunjungan",
  "q": "Apakah perpustakaan buka di hari Minggu atau hari libur nasional?",
  "a": "Jam operasional kami bervariasi. Mohon cek situs web resmi kami."
 },
 {
  "k": "Kunjungan",
  "q": "Sampai jam berapa perpustakaan buka?",
  "a": "Jam operasional kami bervariasi. Mohon cek situs web resmi kami atau bagian informasi kontak."
 },
 {
  "k": "Kunjungan",
  "q": "Jam berapa perpustakaan mulai buka di pagi hari?",
  "a": "Jam operasional kami bervariasi. Mohon cek situs web resmi kami."
 },
 {
  "k": "Peminjaman",
  "q": "Berapa batas maksimal buku yang dapat saya pinjam sekaligus?",
  "a": "Anggota umum biasanya dapat meminjam 3-5 eksemplar, sementara dosen/staf bisa meminjam lebih banyak."
 },
 {
  "k": "Peminjaman",
  "q": "Saya ingin perpanjang pinjaman buku saya, bagaimana caranya?",
  "a": "Anda dapat melakukan perpanjangan mandiri melalui Katalog Online (OPAC) di situs web kami."
 },
 {
  "k": "Peminjaman",
  "q": "Apakah ada biaya denda untuk keterlambatan pengembalian?",
  "a": "Anda akan dikenakan denda sebesar antara Rp 500,- hingga Rp 1.000,- per hari per eksemplar."
 },
 {
  "k": "Peminjaman",
  "q": "Saya kehilangan buku yang dipinjam, apa yang harus saya ganti?",
  "a": "Anda wajib segera melaporkan kehilangan tersebut dan menggantinya dengan buku baru (judul, pengarang, dan edisi yang sama)."
 },
 {
  "k": "Peminjaman",
  "q": "Buku saya sudah jatuh tempo, bagaimana cara membayar dendanya?",
  "a": "Pembayaran denda dapat dilakukan di bagian sirkulasi."
 },
 {
  "k": "Peminjaman",
  "q": "Berapa lama waktu pinjam untuk buku fiksi?",
  "a": "Batas waktu peminjaman standar adalah 7 hari atau 14 hari per eksemplar."
 },
 {
  "k": "Layanan/Koleksi",
  "q": "Di mana saya bisa akses jurnal dan database online?",
  "a": "Koleksi digital dan e-book kami dapat diakses melalui portal E-Resources di situs web perpustakaan."
 },
 {
  "k": "Layanan/Koleksi",
  "q": "Apakah perpustakaan menyediakan akses ke database berbayar?",
  "a": "Koleksi digital dan e-book kami dapat diakses melalui portal E-Resources di situs web perpustakaan."
 },
 {
  "k": "Layanan/Koleksi",
  "q": "Bagaimana cara mencari koleksi buku yang ada di rak?",
  "a": "Anda dapat menggunakan Katalog Online (OPAC) atau bertanya di meja informasi."
 },
 {
  "k": "Layanan/Fasilitas",
  "q": "Saya ingin menggunakan internet, apakah tersedia wifi gratis?",
  "a": "Ya, kami menyediakan layanan Wi-Fi gratis."
 },
 {
  "k": "Layanan/Fasilitas",
  "q": "Apakah ada ruang belajar kelompok yang bisa saya sewa?",
  "a": "Ya, kami menyediakan ruang diskusi atau ruang belajar kelompok yang ketersediaannya dapat dicek di meja layanan."
 },
 {
  "k": "Layanan/Fasilitas",
  "q": "Di mana lokasi ruang fotokopi atau mesin printer?",
  "a": "Ruang fotokopi dan printer biasanya berada di dekat area koleksi umum atau di lantai dasar."
 },
 {
  "k": "Layanan/Fasilitas",
  "q": "Bolehkah saya membawa laptop pribadi ke dalam perpustakaan?",
  "a": "Ya, Anda diperbolehkan membawa laptop pribadi."
 },
 {
  "k": "Layanan/Fasilitas",
  "q": "Apakah ada loker penitipan barang di sini?",
  "a": "Loker penitipan barang tersedia di dekat pintu masuk utama."
 },
 {
  "k": "Kunjungan",
  "q": "Bolehkah saya masuk ke perpustakaan tanpa menjadi anggota?",
  "a": "Kunjungan dan membaca di tempat diperbolehkan, namun Anda tidak bisa meminjam buku."
 },
 {
  "k": "Kunjungan",
  "q": "Apa saja yang tidak boleh dibawa masuk ke perpustakaan?",
  "a": "Tas besar, makanan, dan minuman biasanya tidak diperbolehkan masuk ke area koleksi."
 },
 {
  "k": "Peminjaman",
  "q": "Buku saya sudah di reservasi orang lain, apa masih bisa saya perpanjang?",
  "a": "Perpanjangan tidak bisa dilakukan jika buku sudah direservasi oleh pemustaka lain."
 },
 {
  "k": "Peminjaman",
  "q": "Saya mau pinjam buku, bagaimana prosedurnya?",
  "a": "Anda dapat mencari buku melalui OPAC, bawa buku dan kartu anggota ke meja sirkulasi."
 }
];
  // ==========================================================

  // Isi dengan URL Google Apps Script kalau rating mau dikumpulkan (lihat penjelasan). Kosongkan kalau belum.
  const RATING_ENDPOINT = "https://script.google.com/macros/s/AKfycbwAosMn4lLHReTQYgBUT0Zb-6M2ukXWZRHjeKnKjjSN7dabbLPRdVfu5-MGp7bAXlotgQ/exec";

  const log = document.getElementById("chat-log");
  const box = document.getElementById("chat-box");
  const input = document.getElementById("chat-input");

  // Kata umum yang diabaikan saat mencocokkan
  const STOP = new Set("apa apakah bagaimana berapa kapan dimana di mana yang dan atau saya aku ini itu ada bisa dapat boleh bolehkah untuk dengan dari ke jika kalau mau ingin cara ya kah lah nya pada akan sudah masih sih dong deh kak min tolong mohon gak nggak ngga enggak".split(" "));
  // Padanan kata (bahasa sehari-hari -> kata di FAQ)
  const SYN = { telat:"terlambat", ebook:"book", ngembaliin:"mengembalikan", balikin:"mengembalikan",
    minjem:"pinjam", pinjem:"pinjam", meminjam:"pinjam", peminjaman:"pinjam", pinjaman:"pinjam", dipinjam:"pinjam",
    ngembalikan:"mengembalikan", kembalikan:"mengembalikan", jam:"jam", buka:"buka", tutup:"buka", operasional:"buka",
    daftar:"pendaftaran", mendaftar:"pendaftaran", registrasi:"pendaftaran", kartu:"kartu", ktm:"kartu", member:"anggota", keanggotaan:"anggota",
    perpanjang:"perpanjang", memperpanjang:"perpanjang", extend:"perpanjang", };

  // Penghilang imbuhan sederhana: membawa -> bawa, mengembalikan -> kembali
  function stem(w) {
    let x = w.replace(/(nya|kan|lah|kah|an|i)$/, m => (w.length - m.length >= 4 ? "" : m));
    const p = /^(meng|meny|men|mem|me|peng|pen|pem|per|pe|ber|ter|di|ke)/.exec(x);
    if (p && x.length - p[0].length >= 4) x = x.slice(p[0].length);
    return x;
  }
  const tokens = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/)
    .filter(w => w && !STOP.has(w)).map(w => stem(SYN[w] || w));

  // Kata tambahan yang memberi nilai plus (bukan syarat) agar jawaban lebih tepat
  const BONUS = { daftar: ["syarat", "dokumen"], pendaftaran: ["syarat", "dokumen"] };

  const indexed = FAQ.map(f => ({ f, t: new Set(tokens(f.q)), ta: new Set(tokens(f.a)) }));

  function search(text) {
    const qt = tokens(text);
    if (!qt.length) return [];
    const extra = qt.flatMap(w => (BONUS[w] || []).map(stem));
    return indexed.map(({ f, t, ta }) => {
      // cocok di pertanyaan = 1 poin, cocok hanya di jawaban = 0,5 poin
      const hit = qt.reduce((n, w) => n + (t.has(w) ? 1 : ta.has(w) ? 0.5 : 0), 0);
      const bonus = extra.filter(w => t.has(w)).length * 0.1;
      return { f, score: hit / qt.length, hit, rank: hit / qt.length + bonus };
    }).filter(r => r.hit > 0 && r.score >= 0.6).sort((a, b) => b.rank - a.rank || b.hit - a.hit);
  }

  function addMsg(text, who, related) {
    const el = document.createElement("div");
    el.className = "msg " + who;
    el.textContent = text;
    if (related) {
      const r = document.createElement("div");
      r.className = "related";
      r.textContent = related;
      el.appendChild(r);
    }
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  // ---------- Rating bintang + data responden ----------
  let user = null;   // diisi dari form awal
  let rated = false;
  const LABELS = ["Sangat buruk", "Kurang baik", "Cukup", "Baik", "Sangat baik"];

  function showRating() {
    if (rated || document.querySelector(".rating")) return;
    const wrap = document.createElement("form");
    wrap.className = "rating";
    wrap.innerHTML =
      '<div>Terima kasih sudah bertanya, ' + user.nama + '! Bagaimana penilaianmu untuk layanan kami?</div>' +
      '<div class="stars"></div>' +
      '<div class="err" role="alert"></div>' +
      '<button class="submit" type="submit">Kirim</button>';
    const stars = wrap.querySelector(".stars");
    const err = wrap.querySelector(".err");
    let value = 0;
    function paint(n) { [...stars.children].forEach((x, idx) => x.classList.toggle("on", idx < n)); }
    for (let i = 1; i <= 5; i++) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "★";
      b.setAttribute("aria-label", i + " bintang: " + LABELS[i - 1]);
      b.onmouseenter = () => paint(i);
      b.onclick = () => { value = i; paint(i); err.textContent = ""; };
      stars.appendChild(b);
    }
    stars.onmouseleave = () => paint(value);
    wrap.onsubmit = e => {
      e.preventDefault();
      if (!value) { err.textContent = "Pilih jumlah bintang dulu."; return; }
      submitRating({ nama: user.nama, prodi: user.prodi, rating: value }, wrap);
    };
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function submitRating(data, wrap) {
    rated = true;
    wrap.querySelectorAll("input, button").forEach(el => el.disabled = true);
    const payload = { ...data, waktu: new Date().toISOString() };
    if (RATING_ENDPOINT) {
      fetch(RATING_ENDPOINT, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) }).catch(() => {});
    }
    addMsg("Terima kasih, " + data.nama + "! Kamu memberi " + data.rating + " dari 5 bintang. ⭐", "bot");
  }

  // ---------- Percakapan ----------
  const CLOSING = /^(terima ?kasih|makasih|thanks|thx|sudah|udah|cukup|selesai|tidak|nggak|gak|ga|oke|ok|siap)\b/i;

  function reply(text) {
    if (CLOSING.test(text) && text.split(/\s+/).length <= 4) {
      addMsg("Sama-sama! Senang bisa membantu.", "bot");
      showRating();
      return;
    }
    const res = search(text);
    if (!res.length) {
      addMsg("Maaf, aku belum menemukan jawaban untuk itu. Coba tulis dengan kata lain, misalnya tentang pendaftaran anggota, peminjaman, denda, jam buka, atau fasilitas. Atau tanyakan langsung ke meja informasi perpustakaan.", "bot");
      return;
    }
    const top = res[0];
    const related = res.slice(1, 3).filter(r => r.f.a !== top.f.a).map(r => r.f.q);
    addMsg(top.f.a, "bot", related.length ? "Pertanyaan terkait: " + related.join(" • ") : "");
    addMsg("Ada pertanyaan lain? Kalau sudah cukup, ketik \"terima kasih\" atau tekan Akhiri chat.", "bot");
  }

  document.getElementById("chat-form").onsubmit = e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMsg(text, "user");
    reply(text);
  };

  document.getElementById("end-chat").onclick = () => {
    if (!started) return;
    addMsg("Chat diakhiri.", "bot");
    showRating();
  };

  let started = false;

  document.getElementById("start-form").onsubmit = e => {
    e.preventDefault();
    const nama = document.getElementById("f-nama").value.trim();
    const prodi = document.getElementById("f-prodi").value.trim();
    if (!nama || !prodi) {
      document.getElementById("start-err").textContent = "Nama dan program studi wajib diisi.";
      return;
    }
    user = { nama, prodi };
    started = true;
    document.getElementById("start-form").hidden = true;
    log.hidden = false;
    document.getElementById("chat-form").hidden = false;
    document.getElementById("end-chat").hidden = false;
    addMsg("Halo, " + nama + "! Aku asisten perpustakaan. Ketik pertanyaanmu, misalnya: \"cara daftar anggota\" atau \"denda telat berapa?\"", "bot");
    input.focus();
  };

  document.getElementById("chat-toggle").onclick = () => {
    box.classList.toggle("open");
    if (box.classList.contains("open")) {
      (started ? input : document.getElementById("f-nama")).focus();
    }
  };
</script>
</body>
