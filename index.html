<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot Menu</title>
<style>
  :root { --ink:#1f2a37; --paper:#ffffff; --bg:#f3f5f7; --accent:#2f6f5e; --accent-ink:#ffffff; --bubble:#e8eef0; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6edf3; --paper:#1b232c; --bg:#11171d; --accent:#4fa58d; --accent-ink:#0b1410; --bubble:#27323d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:640px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:1.6rem; margin:0 0 8px; }

  #chat-toggle {
    position:fixed; right:20px; bottom:20px; width:56px; height:56px; border-radius:50%;
    border:0; background:var(--accent); color:var(--accent-ink); font-size:24px; cursor:pointer;
  }
  #chat-box {
    position:fixed; right:20px; bottom:90px; width:min(340px, calc(100vw - 40px)); max-height:70vh;
    display:none; flex-direction:column; background:var(--paper); border:1px solid var(--bubble);
    border-radius:14px; overflow:hidden;
  }
  #chat-box.open { display:flex; }
  #chat-head { padding:12px 16px; background:var(--accent); color:var(--accent-ink); font-weight:600; }
  #chat-log { padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:9px 12px; border-radius:12px; max-width:85%; line-height:1.4; }
  .bot { background:var(--bubble); align-self:flex-start; }
  .user { background:var(--accent); color:var(--accent-ink); align-self:flex-end; }
  #chat-options { padding:10px 14px 14px; display:flex; flex-wrap:wrap; gap:8px; }
  #chat-options button {
    border:1px solid var(--accent); background:transparent; color:var(--ink);
    padding:7px 12px; border-radius:999px; cursor:pointer; font:inherit;
  }
  #chat-options button:hover { background:var(--accent); color:var(--accent-ink); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>

<main>
  <h1>Halaman Uji Coba</h1>
  <p>Klik tombol bulat di pojok kanan bawah untuk membuka menu chatbot.</p>
</main>

<button id="chat-toggle" aria-label="Buka chatbot">💬</button>
<section id="chat-box" aria-live="polite">
  <div id="chat-head">Asisten</div>
  <div id="chat-log"></div>
  <div id="chat-options"></div>
</section>

<script>
  // ====== EDIT BAGIAN INI SAJA UNTUK MENGUBAH ISI MENU ======
  const menu = {
    start: {
      text: "Halo! Mau tanya apa?",
      options: ["Jam layanan", "Lokasi", "Kontak"]
    },
    "Jam layanan": {
      text: "Kami buka Senin–Jumat, pukul 08.00–16.00.",
      options: ["Lokasi", "Kontak", "Menu utama"]
    },
    "Lokasi": {
      text: "Kami berada di Jl. Contoh No. 1, Sumenep.",
      options: ["Jam layanan", "Kontak", "Menu utama"]
    },
    "Kontak": {
      text: "Hubungi kami di email@contoh.com atau 0812-0000-0000.",
      options: ["Jam layanan", "Lokasi", "Menu utama"]
    }
  };
  // ===========================================================

  const box = document.getElementById("chat-box");
  const log = document.getElementById("chat-log");
  const opts = document.getElementById("chat-options");
  const toggle = document.getElementById("chat-toggle");

  function addMsg(text, who) {
    const el = document.createElement("div");
    el.className = "msg " + who;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function show(key) {
    const node = menu[key];
    addMsg(node.text, "bot");
    opts.innerHTML = "";
    node.options.forEach(label => {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = () => {
        addMsg(label, "user");
        show(label === "Menu utama" ? "start" : label);
      };
      opts.appendChild(b);
    });
  }

  let started = false;
  toggle.onclick = () => {
    box.classList.toggle("open");
    if (!started) { started = true; show("start"); }
  };
</script>
</body>
</html>
