<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot Perpustakaan UNIJA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root { --ink:#1f2a37; --paper:#ffffff; --bg:#f3f5f7; --accent:#2f6f5e; --accent-ink:#ffffff; --bubble:#e8eef0; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6edf3; --paper:#1b232c; --bg:#11171d; --accent:#4fa58d; --accent-ink:#0b1410; --bubble:#27323d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:640px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:1.6rem; margin:0 0 8px; }

  #chat-toggle {
    position:fixed; right:20px; bottom:20px; width:56px; height:56px; border-radius:50%;
    border:0; background:var(--accent); color:var(--accent-ink); font-size:24px; cursor:pointer;
    display: none; /* Disembunyikan sampai CSV selesai dimuat */
  }
  #chat-box {
    position:fixed; right:20px; bottom:90px; width:min(340px, calc(100vw - 40px)); max-height:70vh;
    display:none; flex-direction:column; background:var(--paper); border:1px solid var(--bubble);
    border-radius:14px; overflow:hidden;
  }
  #chat-box.open { display:flex; }
  #chat-head { padding:12px 16px; background:var(--accent); color:var(--accent-ink); font-weight:600; }
  #chat-log { padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:9px 12px; border-radius:12px; max-width:85%; line-height:1.4; }
  .bot { background:var(--bubble); align-self:flex-start; }
  .user { background:var(--accent); color:var(--accent-ink); align-self:flex-end; }
  #chat-options { padding:10px 14px 14px; display:flex; flex-wrap:wrap; gap:8px; }
  #chat-options button {
    border:1px solid var(--accent); background:transparent; color:var(--ink);
    padding:7px 12px; border-radius:999px; cursor:pointer; font:inherit; text-align: left;
  }
  #chat-options button:hover { background:var(--accent); color:var(--accent-ink); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>

<main>
  <h1>Layanan Informasi UPT Perpustakaan UNIJA</h1>
  <p id="status-text">Mempersiapkan data FAQ...</p>
</main>

<button id="chat-toggle" aria-label="Buka chatbot">💬</button>
<section id="chat-box" aria-live="polite">
  <div id="chat-head">Asisten Perpustakaan</div>
  <div id="chat-log"></div>
  <div id="chat-options"></div>
</section>

<script>
  let menu = {
    start: {
      text: "Halo! Selamat datang di layanan informasi UPT Perpustakaan Universitas Wiraraja. Silakan pilih kategori pertanyaan:",
      options: []
    },
    "Menu utama": {
      text: "Kembali ke menu utama. Silakan pilih kategori:",
      options: []
    }
  };

  const statusText = document.getElementById("status-text");
  const box = document.getElementById("chat-box");
  const log = document.getElementById("chat-log");
  const opts = document.getElementById("chat-options");
  const toggle = document.getElementById("chat-toggle");

  // Membaca file CSV secara otomatis
  Papa.parse("perpustakaan_faq.csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const data = results.data;
      const kategoriSet = new Set();
      
      // Mengumpulkan semua kategori yang valid
      data.forEach(row => {
        if(row.kategori && row.user_query && row.chatbot_response) {
          kategoriSet.add(row.kategori);
        }
      });

      const kategoriArr = Array.from(kategoriSet);
      menu["start"].options = kategoriArr;
      menu["Menu utama"].options = kategoriArr;

      // Membuat cabang menu untuk setiap kategori dan pertanyaan
      kategoriArr.forEach(kat => {
        const pertanyaanList = data.filter(r => r.kategori === kat).map(r => r.user_query);
        menu[kat] = { 
          text: "Pilih pertanyaan terkait " + kat + ":", 
          options: [...pertanyaanList, "Menu utama"] 
        };
        
        data.filter(r => r.kategori === kat).forEach(r => {
          menu[r.user_query] = { 
            text: r.chatbot_response, 
            options: ["Kembali ke " + kat, "Menu utama"] 
          };
          // Buat jembatan rute "Kembali ke [Kategori]"
          menu["Kembali ke " + kat] = menu[kat];
        });
      });
      
      statusText.innerText = "Sistem siap. Klik tombol 💬 di pojok kanan bawah.";
      toggle.style.display = "block"; // Munculkan tombol chat
    },
    error: function() {
      statusText.innerText = "Gagal memuat data CSV. Pastikan file perpustakaan_faq.csv berada di folder yang sama.";
    }
  });

  function addMsg(text, who) {
    const el = document.createElement("div");
    el.className = "msg " + who;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function show(key) {
    const node = menu[key];
    if (!node) return;
    addMsg(node.text, "bot");
    opts.innerHTML = "";
    node.options.forEach(label => {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = () => {
        addMsg(label, "user");
        show(label === "Menu utama" ? "start" : label);
      };
      opts.appendChild(b);
    });
  }

  let started = false;
  toggle.onclick = () => {
    box.classList.toggle("open");
    if (!started) { 
        started = true; 
        show("start"); 
    }
  };
</script>
</body>
</html>
