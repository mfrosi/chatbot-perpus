
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asisten Perpustakaan UNIJA</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root {
  --bg: #f0f4f8;
  --paper: #ffffff;
  --ink: #1f2937;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --bubble-user: #dbeafe;
  --bubble-bot: #f3f4f6;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, sans-serif;
}

body {
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

#auth-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  text-align: center;
}

.auth-card {
  background: var(--paper);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 4px 16px #0000000d;
  width: 100%;
  max-width: 400px;
}

.auth-card h1 {
  font-size: 1.5rem;
  margin-bottom: 10px;
  color: var(--accent);
}

.auth-card p {
  margin-bottom: 20px;
  color: #6b7280;
}

.auth-card input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #d1d5db;
  border-radius: 8px;
}

.auth-card button {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  margin-top: 10px;
}

#chat-screen {
  display: none;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 900px;
  margin: 0 auto;
  background: var(--paper);
  box-shadow: 0 0 20px #0000000d;
}

#chat-header {
  padding: 16px 20px;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

#chat-header h2 {
  font-size: 1.1rem;
}

#btn-rating {
  background: #f59e0b;
  color: white;
  border: none;
  padding: 9px 13px;
  border-radius: 999px;
  font-size: .85rem;
  font-weight: 600;
}

#chat-log {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.msg {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 16px;
  line-height: 1.6;
  font-size: .96rem;
  overflow-wrap: anywhere;
}

.user {
  background: var(--bubble-user);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.bot {
  background: var(--bubble-bot);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

.msg-text {
  white-space: pre-wrap;
}

.img-preview {
  max-width: 200px;
  max-height: 200px;
  object-fit: contain;
  border-radius: 8px;
  margin-bottom: 8px;
  display: block;
}

#input-area {
  padding: 12px 16px;
  border-top: 1px solid #e5e7eb;
  display: flex;
  gap: 10px;
  align-items: center;
}

#file-label {
  cursor: pointer;
  font-size: 1.5rem;
  padding: 8px;
}

#image-upload {
  display: none;
}

#user-input {
  flex: 1;
  min-width: 0;
  padding: 13px 17px;
  border: 1px solid #d1d5db;
  border-radius: 999px;
  outline: none;
}

#user-input:focus {
  border-color: var(--accent);
}

#send-btn {
  background: var(--accent);
  color: white;
  border: none;
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 50%;
  font-size: 1.2rem;
}

#rating-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #0008;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.rating-box {
  background: white;
  padding: 28px;
  border-radius: 16px;
  text-align: center;
  max-width: 380px;
  width: 100%;
}

.stars {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 18px;
}

.stars button {
  font-size: 1.6rem;
  background: none;
  border: none;
  padding: 5px;
}

#close-rating {
  margin-top: 16px;
  padding: 8px 14px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: white;
}

#status-text {
  font-size: .9rem;
}

@media (max-width: 480px) {
  #chat-header {
    padding: 12px;
  }

  #chat-header h2 {
    font-size: .95rem;
  }

  #btn-rating {
    padding: 8px 10px;
    font-size: .75rem;
  }

  #chat-log {
    padding: 14px;
  }

  .msg {
    max-width: 92%;
  }

  #input-area {
    padding: 10px;
    gap: 6px;
  }
}
</style>
</head>

<body>

<div id="auth-screen">
  <div class="auth-card">
    <h1>Asisten Perpustakaan UNIJA</h1>
    <p id="status-text">Memuat panduan FAQ...</p>

    <input
      type="text"
      id="input-nama"
      placeholder="Nama Lengkap"
      autocomplete="name"
      required
    >

    <input
      type="text"
      id="input-prodi"
      placeholder="Program Studi"
      required
    >

    <button id="btn-mulai" disabled>
      Mulai Obrolan
    </button>
  </div>
</div>

<div id="chat-screen">
  <div id="chat-header">
    <h2>💬 Asisten Perpustakaan</h2>
    <button id="btn-rating">Akhiri & Beri Rating</button>
  </div>

  <div id="chat-log" aria-live="polite"></div>

  <div id="input-area">
    <label
      id="file-label"
      for="image-upload"
      title="Unggah Gambar"
    >📷</label>

    <input
      type="file"
      id="image-upload"
      accept="image/*"
    >

    <input
      type="text"
      id="user-input"
      placeholder="Tanyakan sesuatu..."
      autocomplete="off"
    >

    <button id="send-btn" aria-label="Kirim pesan">➤</button>
  </div>
</div>

<div id="rating-modal">
  <div class="rating-box">
    <h3>Seberapa puas Anda?</h3>
    <p style="margin-top:8px;color:#6b7280">
      Pilih nilai 1 sampai 5 bintang.
    </p>
    <div class="stars" id="star-container"></div>
    <button id="close-rating">Batal</button>
  </div>
</div>

<script>
"use strict";

// ==================================================
// KONFIGURASI
// ==================================================

const GOOGLE_APP_URL =
  "https://script.google.com/macros/s/AKfycbzipIYGDITOYkLfSNfgd-DAKqT8bbtLhXiRzmCvLxXDZwTzVCL7jaSF5blH5NgRLcY/exec";

const FAQ_URL = "perpustakaan_faq.csv";

let dataUser = {
  nama: "",
  prodi: ""
};

let systemInstruction =
  "Kamu adalah asisten UPT Perpustakaan Universitas Wiraraja (UNIJA). " +
  "Jawab dengan ramah, jelas, dan dalam bahasa Indonesia. " +
  "Gunakan FAQ berikut sebagai sumber utama. " +
  "Jika informasi tidak tersedia, katakan dengan jujur bahwa pengguna " +
  "perlu menghubungi petugas perpustakaan.\n\n";

let faqReady = false;
let isSending = false;
let isEnding = false;

const authScreen = document.getElementById("auth-screen");
const chatScreen = document.getElementById("chat-screen");
const btnMulai = document.getElementById("btn-mulai");
const statusText = document.getElementById("status-text");
const chatLog = document.getElementById("chat-log");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const imageUpload = document.getElementById("image-upload");
const ratingModal = document.getElementById("rating-modal");

// ==================================================
// MEMUAT FAQ CSV
// ==================================================

function loadFAQ() {
  if (typeof Papa === "undefined") {
    statusText.textContent =
      "Gagal memuat library CSV. Periksa koneksi internet.";
    return;
  }

  Papa.parse(FAQ_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,

    complete: function(results) {
      if (results.errors && results.errors.length > 0) {
        console.warn("Peringatan CSV:", results.errors);
      }

      const rows = results.data || [];
      let count = 0;

      rows.forEach(function(row) {
        const question = String(
          row.user_query || ""
        ).trim();

        const answer = String(
          row.chatbot_response || ""
        ).trim();

        if (question && answer) {
          systemInstruction +=
            "Tanya: " + question + "\n" +
            "Jawab: " + answer + "\n\n";

          count++;
        }
      });

      faqReady = true;
      btnMulai.disabled = false;

      statusText.textContent = count > 0
        ? "Sistem siap digunakan! " + count + " FAQ dimuat."
        : "Sistem siap. FAQ kosong atau format kolom CSV tidak sesuai.";
    },

    error: function(error) {
      console.error("Gagal memuat FAQ:", error);

      statusText.textContent =
        "FAQ gagal dimuat. Periksa lokasi file CSV.";
    }
  });
}

loadFAQ();

// ==================================================
// MEMULAI CHAT
// ==================================================

btnMulai.addEventListener("click", function() {
  const nama = document
    .getElementById("input-nama")
    .value.trim();

  const prodi = document
    .getElementById("input-prodi")
    .value.trim();

  if (!nama || !prodi) {
    alert("Harap isi nama lengkap dan program studi.");
    return;
  }

  if (!faqReady) {
    alert("Panduan FAQ masih dimuat. Silakan tunggu.");
    return;
  }

  dataUser = { nama, prodi };

  authScreen.style.display = "none";
  chatScreen.style.display = "flex";

  addMsg(
    "bot",
    "Halo " + nama +
    "! Selamat datang di layanan informasi UPT Perpustakaan UNIJA. " +
    "Silakan tanyakan informasi yang kamu butuhkan."
  );

  userInput.focus();
});

// ==================================================
// MENAMPILKAN PESAN DENGAN AMAN
// ==================================================

function addMsg(who, text, imgFile = null) {
  const div = document.createElement("div");
  div.className = "msg " + who;

  if (imgFile) {
    const img = document.createElement("img");
    img.className = "img-preview";
    img.alt = "Gambar yang diunggah";
    img.src = URL.createObjectURL(imgFile);

    img.onload = function() {
      URL.revokeObjectURL(img.src);
    };

    div.appendChild(img);
  }

  const p = document.createElement("div");
  p.className = "msg-text";
  p.textContent = String(text || "");

  div.appendChild(p);
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;

  return div;
}

// ==================================================
// MENGIRIM REQUEST KE APPS SCRIPT
// ==================================================

async function postToServer(payload) {
  const response = await fetch(GOOGLE_APP_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payload)
  });

  const raw = await response.text();

  let data;

  try {
    data = JSON.parse(raw);
  } catch (error) {
    throw new Error(
      "Server tidak mengirim JSON yang valid. " +
      "Periksa deployment Apps Script dan izin akses."
    );
  }

  if (!response.ok) {
    throw new Error(
      data.message ||
      data.error ||
      "HTTP " + response.status
    );
  }

  return data;
}

// ==================================================
// MENGIRIM PESAN CHAT
// ==================================================

async function handleSend() {
  if (isSending || isEnding) return;

  const text = userInput.value.trim();
  const file = imageUpload.files[0];

  if (!text && !file) return;

  if (file && !file.type.startsWith("image/")) {
    addMsg("bot", "File yang dipilih bukan gambar.");
    imageUpload.value = "";
    return;
  }

  if (file && file.size > 10 * 1024 * 1024) {
    addMsg("bot", "Ukuran gambar maksimal 10 MB.");
    imageUpload.value = "";
    return;
  }

  isSending = true;
  sendBtn.disabled = true;
  userInput.disabled = true;

  addMsg("user", text || "(Mengirim gambar)", file);

  userInput.value = "";
  imageUpload.value = "";

  let finalQuery = text;
  let typingIndicator = null;

  try {
    // Membaca teks dalam gambar, jika ada.
    if (file) {
      typingIndicator = addMsg(
        "bot",
        "Sedang membaca teks dari gambar..."
      );

      if (typeof Tesseract === "undefined") {
        throw new Error(
          "Library pembaca gambar gagal dimuat. " +
          "Periksa koneksi internet."
        );
      }

      const result = await Tesseract.recognize(
        file,
        "ind"
      );

      const imageText = String(
        result.data.text || ""
      ).trim();

      if (imageText.length > 3) {
        finalQuery +=
          "\n\nTeks yang terbaca dari gambar:\n" +
          imageText;
      } else if (!text) {
        throw new Error(
          "Tidak ada teks yang terbaca dari gambar. " +
          "Coba gambar yang lebih jelas."
        );
      }

      typingIndicator.remove();
      typingIndicator = null;
    }

    if (!finalQuery.trim()) {
      throw new Error("Pertanyaan tidak boleh kosong.");
    }

    typingIndicator = addMsg(
      "bot",
      "Menghubungi asisten cerdas..."
    );

    const data = await postToServer({
      action: "chat",
      systemInstruction: systemInstruction,
      userMessage: finalQuery
    });

    if (data.reply) {
      typingIndicator.querySelector(".msg-text").textContent =
        data.reply;
    } else {
      const detail =
        data.message ||
        (typeof data.error === "string" ? data.error : "") ||
        "Server tidak memberikan jawaban.";

      typingIndicator.querySelector(".msg-text").textContent =
        "Maaf, chatbot belum bisa menjawab.\nDetail: " + detail;

      console.error("Respons Apps Script:", data);
    }

  } catch (error) {
    console.error("Kesalahan chatbot:", error);

    const message =
      "Maaf, terjadi masalah.\n" +
      "Detail: " + error.message;

    if (typingIndicator && typingIndicator.isConnected) {
      typingIndicator.querySelector(".msg-text").textContent =
        message;
    } else {
      addMsg("bot", message);
    }

  } finally {
    isSending = false;
    sendBtn.disabled = false;
    userInput.disabled = false;
    userInput.focus();
  }
}

sendBtn.addEventListener("click", handleSend);

userInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    handleSend();
  }
});

// ==================================================
// RATING KEPUASAN
// ==================================================

document.getElementById("btn-rating").addEventListener(
  "click",
  function() {
    if (isSending || isEnding) {
      alert("Tunggu sampai pesan selesai diproses.");
      return;
    }

    ratingModal.style.display = "flex";

    const starsDiv = document.getElementById("star-container");
    starsDiv.replaceChildren();

    for (let rating = 1; rating <= 5; rating++) {
      const button = document.createElement("button");

      button.type = "button";
      button.textContent = "⭐".repeat(rating);
      button.setAttribute(
        "aria-label",
        rating + " dari 5 bintang"
      );

      button.addEventListener("click", async function() {
        if (isEnding) return;

        isEnding = true;
        starsDiv.querySelectorAll("button").forEach(
          button => button.disabled = true
        );

        try {
          const result = await postToServer({
            action: "rating",
            nama: dataUser.nama,
            prodi: dataUser.prodi,
            rating: rating
          });

          if (result.status !== "success") {
            throw new Error(
              result.message || "Rating belum berhasil disimpan."
            );
          }

          ratingModal.style.display = "none";

          addMsg(
            "user",
            "Memberikan rating: " + "⭐".repeat(rating)
          );

          addMsg(
            "bot",
            "Terima kasih atas penilaianmu! " +
            "Masukan ini membantu meningkatkan layanan perpustakaan."
          );

          // Kembali ke halaman awal setelah memberikan rating.
          setTimeout(function() {
            chatScreen.style.display = "none";
            authScreen.style.display = "flex";
            chatLog.replaceChildren();
            document.getElementById("input-nama").value = "";
            document.getElementById("input-prodi").value = "";
            isEnding = false;
            starsDiv.replaceChildren();
          }, 1800);

        } catch (error) {
          console.error("Gagal menyimpan rating:", error);

          alert(
            "Rating gagal disimpan.\nDetail: " + error.message
          );

          isEnding = false;

          starsDiv.querySelectorAll("button").forEach(
            button => button.disabled = false
          );
        }
      });

      starsDiv.appendChild(button);
    }
  }
);

document.getElementById("close-rating").addEventListener(
  "click",
  function() {
    ratingModal.style.display = "none";
  }
);
</script>

</body>
</html>
